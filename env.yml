# Conda env for hypex (GridNavi WTE notebooks + hyper/ MuJoCo training).
# Requires Python 3.10 before/via this file (do not use 3.11+ for this stack yet).
#
# Linux + NVIDIA GPU:
#   conda env create -f env.yml
#   conda activate adv_rl
#   python -c "import torch; print(torch.__version__, torch.cuda.is_available())"
#   python -c "import mujoco, gymnasium; print('mujoco ok')"
#
# If CUDA is unavailable after create, install a matching wheel, e.g.:
#   pip install --upgrade torch torchvision --index-url https://download.pytorch.org/whl/cu121

name: adv_rl
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - numpy>=1.23
  - scipy>=1.10
  - matplotlib>=3.7
  - scikit-learn>=1.3
  - pandas>=2.0
  - tqdm>=4.65
  - pillow>=10.0
  - pyyaml>=6.0
  - seaborn>=0.13
  - networkx>=3.0
  - pot>=0.9.4
  # PyTorch with CUDA 12.1 (Linux GPU). CPU-only machines can still create the
  # env; fall back to the pip index-url note above if needed.
  - pytorch::pytorch>=2.1
  - pytorch::torchvision>=0.16
  - pytorch::pytorch-cuda=12.1
  - pip:
      - gymnasium[mujoco]>=0.29
      - mujoco
      - imageio
      - stable-baselines3
      - cloudpickle>=2.2
      - tensorboard>=2.14
